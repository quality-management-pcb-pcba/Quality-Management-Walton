name: Firebase Storage Security Rules Unit Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'test/**'
      - 'src/services/storage.ts'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'test/**'
      - 'src/services/storage.ts'
  workflow_dispatch:

jobs:
  storage-rules-test:
    name: Run Firebase Storage Emulator Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java Runtime Environment (JRE 17 for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnostic Repository Inspection
        run: |
          pwd
          git status --short
          ls -la
          find . -maxdepth 3 -name 'package-lock.json' -o -name 'npm-shrinkwrap.json' -o -name 'yarn.lock'

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify Firebase CLI & Java version
        run: |
          java -version
          npx firebase --version

      - name: Execute Storage Rules Unit Test Suite
        run: |
          npm run test:storage
